name: Validar rediseño del observatorio
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/assets/**'
      - 'tests/ui_wave_design.test.mjs'
      - 'tests/ui_simplicity.test.mjs'
      - 'tests/lectura_ciudadana.test.mjs'
      - 'tests/guide3d.test.mjs'
      - 'tests/ocean_theme.test.mjs'
      - 'tests/panorama.e2e.cjs'
      - 'tests/publication.e2e.cjs'
      - 'tests/ciudadano.e2e.cjs'
      - 'tests/test_build.py'
      - 'pipeline/build.py'
      - '.github/workflows/validate-visual.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/**'
      - 'tests/ui_wave_design.test.mjs'
      - 'tests/ui_simplicity.test.mjs'
      - 'tests/panorama.e2e.cjs'
      - 'tests/publication.e2e.cjs'
      - 'tests/ciudadano.e2e.cjs'
      - 'tests/test_build.py'
      - 'pipeline/build.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar estructura, fuentes, recursos y actualización
        run: node --test tests/ui_simplicity.test.mjs tests/ui_wave_design.test.mjs tests/lectura_ciudadana.test.mjs tests/guide3d.test.mjs tests/ocean_theme.test.mjs
      - name: Comprobar módulos y scripts
        run: |
          node --check site/assets/app.mjs
          node --check site/assets/appearance.mjs
          node --check site/assets/guide3d.mjs
          node --check site/assets/ocean-experience.mjs
          node --check tests/panorama.e2e.cjs
          node --check site/assets/publication.mjs
          node --check tests/publication.e2e.cjs
          node --check tests/ciudadano.e2e.cjs
      - name: Comprobar versiones de los recursos publicados
        run: python -m unittest discover -s tests -p 'test_build.py' -v
      - name: Preparar Chromium para las pruebas del mapa
        run: |
          npm install --prefix "$RUNNER_TEMP/observatorio-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/observatorio-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Probar filtros, accesibilidad y vista móvil de Panorama
        run: |
          NODE_PATH="$RUNNER_TEMP/observatorio-browser/node_modules" node tests/panorama.e2e.cjs
          NODE_PATH="$RUNNER_TEMP/observatorio-browser/node_modules" node tests/publication.e2e.cjs
          NODE_PATH="$RUNNER_TEMP/observatorio-browser/node_modules" node tests/ciudadano.e2e.cjs
