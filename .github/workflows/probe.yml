name: Sondeo de conectividad
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explorar gob.pe y repositorios alcanzables
        run: |
          fetch() { curl -sS -m 30 -L -A "Mozilla/5.0" "$1" 2>&1; }
          for u in \
            https://www.gob.pe/institucion/imarpe/noticias \
            https://www.gob.pe/institucion/senamhi/noticias \
            https://www.gob.pe/institucion/imarpe/informes-publicaciones \
            https://www.gob.pe/institucion/senamhi/informes-publicaciones \
            "https://www.gob.pe/busquedas?term=comunicado+oficial+enfen" \
            https://www.gob.pe/institucion/senamhi/campañas \
            https://www.gob.pe/senamhi ; do
            echo "=== $u"
            fetch "$u" > page.html
            echo "bytes=$(wc -c < page.html) title=$(grep -o '<title>[^<]*' page.html | head -1)"
            grep -oE 'href="[^"]*"[^>]*>[^<]{0,140}' page.html | grep -iE 'enfen|comunicado|pron[oó]stico|ni[nñ]o|informe' | head -12
          done
          echo "=== IGP"
          fetch "https://repositorio.igp.gob.pe/discover?query=comunicado+oficial+enfen" > igp.html
          echo "bytes=$(wc -c < igp.html)"
          grep -oE 'href="/handle/[^"]*"[^>]*>[^<]{0,120}' igp.html | head -8
