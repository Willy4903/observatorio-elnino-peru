name: Sondeo de conectividad
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explorar SINIA
        run: |
          fetch() { curl -sS -m 30 -L -A "Mozilla/5.0" "$1" 2>&1; }
          echo "=== registro 326992"
          fetch https://sinia.minam.gob.pe/metadatos/326992 > r.html
          echo "bytes=$(wc -c < r.html)"
          python3 - <<'PY'
          import re,html
          t=open('r.html',errors='replace').read()
          t=re.sub(r'<(script|style)[^>]*>.*?</\1>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          t=re.sub(r'\n\s*\n+','\n',t)
          print(t[:3500])
          PY
          grep -oE 'href="[^"]*(pdf|download|bitstream|documentos)[^"]*"' r.html | head -5
          echo "=== busqueda"
          fetch "https://sinia.minam.gob.pe/buscar?search_api_fulltext=comunicado+oficial+enfen" > s.html
          echo "bytes=$(wc -c < s.html)"
          grep -oE 'href="/(metadatos|documentos)/[^"]*"[^>]*>[^<]{0,120}' s.html | head -10
